[project]
name = "research-assistant"
version = "0.1.0"
description = "AI Research Assistant Agent — automatically plans, searches, synthesizes, and reports with citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Research Assistant Team" },
]

dependencies = [
    "langgraph>=0.2.50",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.39.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "langfuse>=2.53.0",
    "streamlit>=1.40.0",
    "chromadb>=0.5.15",
    "sentence-transformers>=3.0.0",
    "trafilatura>=1.12.0",
    "arxiv>=2.1.3",
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ANN", # flake8-annotations
    "ASYNC",
    "C4",  # flake8-comprehensions
    "PIE",
    "PTH", # flake8-use-pathlib
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
]
ignore = [
    "ANN401", # allow typing.Any where explicitly needed (tool args from LLM)
    "E501",   # handled by formatter
    "TC001",  # moving first-party imports into TYPE_CHECKING adds noise
    "TC002",  # same for third-party imports that are used at runtime (e.g. pytest fixtures)
    "TC003",  # same for stdlib
    "TC006",  # cast() without string literal — readability regression, skip
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"notebooks/**" = ["ANN", "E402"]
"ui/**" = ["ANN201"] # streamlit scripts don't need return type on module
"src/research_assistant/cli.py" = ["T201"] # CLI prints to stdout intentionally

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["src/research_assistant"]

[[tool.mypy.overrides]]
module = [
    "tavily.*",
    "langfuse.*",
    "sentence_transformers.*",
    "trafilatura.*",
    "arxiv.*",
    "pymupdf.*",
    "yaml.*",
    "rank_bm25.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration (may call external APIs)",
    "eval: marks tests as evaluation-only (not run in CI)",
]
