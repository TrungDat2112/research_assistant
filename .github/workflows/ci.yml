name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.7"
          python-version: "3.11"
          enable-cache: true
          cache-python: true

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/research_assistant

      - name: Pytest
        run: uv run pytest

  deploy_hf:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-hf-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Push main to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "Skipping deploy to HF Space: HF_TOKEN secret is unset (OK for forks / local-only)." >&2
            exit 0
          fi
          HF_USER="${HF_USERNAME:-orion211203}"
          git remote remove hf 2>/dev/null || true
          git remote add hf "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/research-assistant.git"
          git push hf HEAD:main
